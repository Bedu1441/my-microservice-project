controller:
  serviceType: LoadBalancer
  securityContext:
    runAsUser: 0
    runAsGroup: 0
    fsGroup: 0

  persistence:
    enabled: true
    storageClass: gp3-csi
    size: 8Gi

  installPlugins:
    - kubernetes
    - workflow-aggregator
    - git
    - configuration-as-code
    - credentials-binding

  JCasC:
    defaultConfig: true
    configScripts:
      kubernetes-cloud: |
        jenkins:
          clouds:
            - kubernetes:
                name: "kubernetes"
                serverUrl: "https://kubernetes.default"
                namespace: "jenkins"
                jenkinsUrl: "http://jenkins.jenkins.svc.cluster.local:8080"
                jenkinsTunnel: "jenkins-agent.jenkins.svc.cluster.local:50000"
                containerCapStr: "10"
                skipTlsVerify: true
                credentialsId: ""
                templates:
                  - name: "kaniko"
                    label: "kaniko"
                    serviceAccount: "jenkins-agent"
                    yaml: |
                      apiVersion: v1
                      kind: Pod
                      spec:
                        serviceAccountName: jenkins-agent
                        containers:
                        - name: kaniko
                          image: gcr.io/kaniko-project/executor:latest
                          command:
                          - sleep
                          args:
                          - infinity
                          volumeMounts:
                          - name: docker-config
                            mountPath: /kaniko/.docker
                        - name: tools
                          image: alpine:3.20
                          command:
                          - sleep
                          args:
                          - infinity
                        volumes:
                        - name: docker-config
                          emptyDir: {}

agent:
  enabled: true
